name: Muse Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "electron/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - "tests/**"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    # Use the Visual Studio 2022 toolchain supported by the native PTY rebuild.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # node-gyp bundled by the PTY rebuild still imports distutils.
        # Python 3.12+ no longer ships it.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Protocol and authentication tests
        run: npm test

      - name: Install test browser
        run: npx playwright install chromium

      - name: Desktop UI tests
        run: npm run test:ui

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Verify packaged native application
        run: node tests/electron-smoke.cjs
        env:
          MUSE_PACKAGED_EXE: release/win-unpacked/Muse Desktop.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: muse-code-desktop-windows
          path: release/*.exe
          if-no-files-found: error
